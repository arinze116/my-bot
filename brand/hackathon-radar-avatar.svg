<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Hackathon Radar avatar</title>
  <desc id="description">A cyan radar sweep surrounds code brackets and an amber opportunity signal on a midnight field.</desc>
  <defs>
    <radialGradient id="background" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#16304A"/>
      <stop offset="0.55" stop-color="#0B1C2E"/>
      <stop offset="1" stop-color="#050B14"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38E8FF" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#38E8FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#51F6A6" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="code" x1="0" x2="1">
      <stop offset="0" stop-color="#38E8FF"/>
      <stop offset="1" stop-color="#51F6A6"/>
    </linearGradient>
    <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amber-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="512" cy="512" r="454"/></clipPath>
  </defs>

  <circle cx="512" cy="512" r="470" fill="#03070D"/>
  <circle cx="512" cy="512" r="454" fill="url(#background)" stroke="#1D4058" stroke-width="4"/>

  <g clip-path="url(#disc)">
    <path d="M512 512 L879 214 A454 454 0 0 1 966 512 Z" fill="url(#sweep)"/>
    <path d="M512 512 L895 230" stroke="#51F6A6" stroke-width="6" stroke-linecap="round" opacity="0.76" filter="url(#cyan-glow)"/>

    <g fill="none" stroke="#38E8FF" opacity="0.28">
      <circle cx="512" cy="512" r="118" stroke-width="5"/>
      <circle cx="512" cy="512" r="238" stroke-width="4"/>
      <circle cx="512" cy="512" r="356" stroke-width="4"/>
      <path d="M512 158 V332 M512 692 V866 M158 512 H332 M692 512 H866" stroke-width="4"/>
    </g>

    <g fill="none" stroke="url(#code)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyan-glow)">
      <path d="M438 395 L322 512 L438 629"/>
      <path d="M586 395 L702 512 L586 629"/>
    </g>
    <path d="M553 371 L471 653" stroke="#DDFDFF" stroke-width="24" stroke-linecap="round" opacity="0.94"/>

    <circle cx="747" cy="323" r="30" fill="#FFB454" opacity="0.38" filter="url(#amber-glow)"/>
    <circle cx="747" cy="323" r="17" fill="#FFB454" stroke="#FFF1D8" stroke-width="5"/>
    <circle cx="512" cy="512" r="9" fill="#F3F7FB"/>
  </g>
</svg>
